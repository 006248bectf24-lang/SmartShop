<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout - SmartShop</title>


    <!-- Existing CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <h2>SmartShop</h2>

        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="products.html">
                    Products
                </a>
            </li>

            <li>
                <a href="wishlist.html">
                    ❤️ Wishlist
                    (<span id="wishlist-count">0</span>)
                </a>
            </li>

            <li>
                <a href="cart.html">
                    Cart 🛒
                    (<span id="cart-count">0</span>)
                </a>
            </li>

            <li>
                <a href="contact.html">
                    Contact
                </a>
            </li>

        </ul>

    </nav>


    <!-- ================= CHECKOUT ================= -->

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow p-4">

                    <h1 class="text-3xl font-bold text-center mb-3">
                        Checkout 🛒
                    </h1>

                    <p class="text-center text-gray-600 mb-4">
                        Enter your information to place your order.
                    </p>


                    <form id="checkoutForm">


                        <!-- FULL NAME -->

                        <div class="mb-3">

                            <label
                                for="fullName"
                                class="form-label"
                            >
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                class="form-control"
                                placeholder="Full Name"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Email Address"
                                required
                            >

                        </div>


                        <!-- PHONE -->

                        <div class="mb-3">

                            <label
                                for="phone"
                                class="form-label"
                            >
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                class="form-control"
                                placeholder="Phone Number"
                                required
                            >

                        </div>


                        <!-- ADDRESS -->

                        <div class="mb-3">

                            <label
                                for="address"
                                class="form-label"
                            >
                                Delivery Address
                            </label>

                            <textarea
                                id="address"
                                class="form-control"
                                placeholder="Delivery Address"
                                rows="4"
                                required
                            ></textarea>

                        </div>


                        <!-- CITY -->

                        <div class="mb-3">

                            <label
                                for="city"
                                class="form-label"
                            >
                                City
                            </label>

                            <input
                                type="text"
                                id="city"
                                class="form-control"
                                placeholder="City"
                                required
                            >

                        </div>


                        <!-- PAYMENT -->

                        <div class="mb-4">

                            <label
                                for="paymentMethod"
                                class="form-label"
                            >
                                Payment Method
                            </label>

                            <select
                                id="paymentMethod"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Payment Method
                                </option>

                                <option value="Cash on Delivery">
                                    Cash on Delivery
                                </option>

                                <option value="Card">
                                    Credit / Debit Card
                                </option>

                            </select>

                        </div>


                        <!-- BUTTON -->

                        <div class="text-center">

                            <button
                                type="submit"
                                class="btn btn-primary px-5"
                            >
                                Place Order 🛍️
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>
            SmartShop
        </h3>

        <p>
            Your smart destination
            for online shopping.
        </p>

        <p>
            © 2026 SmartShop.
            All Rights Reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="../js/script.js"></script>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
