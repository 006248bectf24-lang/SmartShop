<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Us - SmartShop</title>


    <!-- Existing CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <h2>SmartShop</h2>

        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="products.html">
                    Products
                </a>
            </li>

            <li>
                <a href="wishlist.html">
                    ❤️ Wishlist
                    (<span id="wishlist-count">0</span>)
                </a>
            </li>

            <li>
                <a href="cart.html">
                    Cart 🛒
                    (<span id="cart-count">0</span>)
                </a>
            </li>

            <li>
                <a href="contact.html">
                    Contact
                </a>
            </li>

        </ul>

    </nav>


    <!-- ================= CONTACT ================= -->

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow p-4">

                    <h1 class="text-3xl font-bold text-center mb-3">
                        Contact Us 📩
                    </h1>

                    <p class="text-center text-gray-600 mb-4">
                        Have a question? We'd love to hear from you.
                    </p>


                    <form id="contactForm">


                        <!-- NAME -->

                        <div class="mb-3">

                            <label
                                for="contactName"
                                class="form-label"
                            >
                                Your Name
                            </label>

                            <input
                                type="text"
                                id="contactName"
                                class="form-control"
                                placeholder="Your Name"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="contactEmail"
                                class="form-label"
                            >
                                Your Email
                            </label>

                            <input
                                type="email"
                                id="contactEmail"
                                class="form-control"
                                placeholder="Your Email"
                                required
                            >

                        </div>


                        <!-- PHONE -->

                        <div class="mb-3">

                            <label
                                for="contactPhone"
                                class="form-label"
                            >
                                Your Phone Number
                            </label>

                            <input
                                type="tel"
                                id="contactPhone"
                                class="form-control"
                                placeholder="Your Phone Number"
                                required
                            >

                        </div>


                        <!-- MESSAGE -->

                        <div class="mb-4">

                            <label
                                for="contactMessage"
                                class="form-label"
                            >
                                Your Message
                            </label>

                            <textarea
                                id="contactMessage"
                                class="form-control"
                                rows="6"
                                placeholder="Write your message..."
                                required
                            ></textarea>

                        </div>


                        <!-- BUTTON -->

                        <div class="text-center">

                            <button
                                type="submit"
                                class="btn btn-primary px-5"
                            >
                                Send Message 📩
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>
            SmartShop
        </h3>

        <p>
            Your smart destination
            for online shopping.
        </p>

        <p>
            © 2026 SmartShop.
            All Rights Reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="../js/script.js"></script>

    <script src="../js/contact.js"></script>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
